<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <header class="store-header">
    <h1>Mi Tienda</h1>
  </header>

  <main class="store-grid">

    <article class="product-card">
      <h2>Producto 1</h2>
      <p class="product-price">$10.00 MXN</p>
      <button class="btn" id="btn-producto1">Comprar</button>
      <p class="error-msg" id="error-producto1"></p>
    </article>

    <article class="product-card">
      <h2>Producto 2</h2>
      <p class="product-price">$15.00 MXN</p>
      <button class="btn" id="btn-producto2">Comprar</button>
      <p class="error-msg" id="error-producto2"></p>
    </article>

  </main>

  <script src="/js/controlador.js"></script>
</body>
</html>
